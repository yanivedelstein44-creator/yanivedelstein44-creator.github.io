<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="tv-app" content="planet-defenders">
<meta name="tv-build" content="100">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03050b">
<title>מגיני הכוכב</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #03050b; color: #eef3fa; font-family: system-ui, 'Segoe UI', Arial, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
canvas#ov { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; z-index: 50; background: #03050b; }
button { font-family: inherit; color: inherit; cursor: pointer; }

/* ---------------------------------------------------------------- HUD */
#hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s; }
body.playing #hud { opacity: 1; }
body.inmenu #hud { opacity: 0 !important; }
#hud > * { pointer-events: auto; }
.glass { background: rgba(10, 16, 30, 0.72); border: 1px solid rgba(160, 200, 255, 0.18); backdrop-filter: blur(6px); }

#top { position: absolute; top: max(6px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; pointer-events: none; }
.pill { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 16px; background: rgba(10, 16, 30, 0.72); border: 1px solid rgba(160, 200, 255, 0.2); font-size: 14px; white-space: nowrap; }
.pill .ic { font-size: 15px; }
.pill b { font-variant-numeric: tabular-nums; direction: ltr; }
.pill small { opacity: .8; font-size: 11px; direction: ltr; }
.pill.gold b { color: #ffd76a; font-size: 16px; }
.pill.gold small { color: #ffe9a8; }
.bar { width: 74px; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.15); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #3fa9ff, #8fe3ff); transition: width .3s; }
.bar.red i { background: linear-gradient(90deg, #ff4f45, #ffa08a); }
.pill.sh { font-size: 12px; letter-spacing: 1px; }

#views { position: absolute; right: max(6px, env(safe-area-inset-right)); top: 50%; transform: translateY(-58%); display: flex; flex-direction: column; gap: 6px; }
#views button, #corner button { width: 46px; height: 46px; border-radius: 14px; border: 1px solid rgba(160, 200, 255, 0.22); background: rgba(10, 16, 30, 0.72); font-size: 19px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
#views button small { font-size: 9px; margin-top: 2px; opacity: .85; }
#views button:active, #corner button:active { transform: scale(.94); }
#corner { position: absolute; left: max(6px, env(safe-area-inset-left)); top: max(6px, env(safe-area-inset-top)); display: flex; gap: 6px; }
#corner button { width: 40px; height: 36px; font-size: 15px; }

#alert { position: absolute; top: 48px; left: 50%; transform: translateX(-50%); padding: 6px 14px; border-radius: 12px; background: rgba(120, 10, 10, 0.85); border: 1px solid #ff6a5a; font-size: 14px; display: none; animation: pulse 1s infinite alternate; cursor: pointer; white-space: nowrap; }
#alert.show { display: block; }
#alert b { direction: ltr; display: inline-block; font-variant-numeric: tabular-nums; }
#alert small { opacity: .75; margin-inline-start: 6px; font-size: 11px; }
@keyframes pulse { from { box-shadow: 0 0 0 rgba(255, 80, 60, 0); } to { box-shadow: 0 0 18px rgba(255, 80, 60, .8); } }

/* the build bar: big cards with a picture of the building, its group color and its price */
#build { position: absolute; bottom: max(4px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); }
#cards { display: flex; gap: 5px; padding: 5px; border-radius: 16px; background: rgba(8, 12, 24, 0.72); border: 1px solid rgba(160, 200, 255, 0.16); }
.card { position: relative; width: 68px; height: 78px; border-radius: 12px; border: 0; padding: 0; overflow: hidden; background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.02)); box-shadow: inset 0 3px 0 var(--gc); display: flex; flex-direction: column; align-items: center; }
.card img { width: 58px; height: 46px; object-fit: contain; margin-top: 4px; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .5)); }
.card .nm { font-size: 10.5px; line-height: 1.1; white-space: nowrap; }
.card .cost { font-size: 11px; color: #ffd76a; direction: ltr; }
.card .cd { position: absolute; inset: 0; border-radius: 12px; pointer-events: none; }
.card.poor { filter: grayscale(.8) brightness(.7); }
.card.on { outline: 2px solid #9dffb0; background: rgba(120, 255, 160, 0.16); }
.card:active { transform: scale(.95); }

#fleetBtn { position: absolute; right: max(6px, env(safe-area-inset-right)); bottom: max(6px, env(safe-area-inset-bottom)); width: 64px; height: 64px; border-radius: 18px; border: 1px solid rgba(176, 124, 255, .5); background: rgba(30, 14, 56, 0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; }
#fleetBtn span { font-size: 22px; }
#fleetBtn b { font-size: 14px; }
#fleetBtn small { font-size: 9px; opacity: .8; }
#fleetBtn.ready { box-shadow: 0 0 14px rgba(176, 124, 255, .75); }

#mini { position: absolute; left: max(6px, env(safe-area-inset-left)); bottom: max(6px, env(safe-area-inset-bottom)); width: 104px; height: 104px; border-radius: 50%; touch-action: none; }

/* panels */
.sheet { position: absolute; left: max(116px, calc(env(safe-area-inset-left) + 116px)); bottom: 96px; width: 270px; max-height: calc(100% - 150px); overflow: auto; padding: 10px; border-radius: 16px; background: rgba(10, 16, 30, 0.86); border: 1px solid rgba(160, 200, 255, 0.22); display: none; font-size: 13px; }
.sheet.show { display: block; }
.ph { display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--gc); padding-bottom: 6px; margin-bottom: 6px; }
.ph img { width: 54px; height: 44px; object-fit: contain; }
.ph .big { font-size: 30px; }
.ph div { flex: 1; display: flex; flex-direction: column; }
.ph b { font-size: 16px; }
.ph small { opacity: .75; font-size: 11px; }
.stars { color: #ffd76a; letter-spacing: 1px; font-size: 13px; }
.x { width: 30px; height: 30px; border-radius: 10px; border: 0; background: rgba(255, 255, 255, 0.1); font-size: 14px; }
.hp { position: relative; height: 16px; border-radius: 8px; background: rgba(255, 255, 255, 0.12); overflow: hidden; margin: 4px 0; }
.hp i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #3fd06a, #9df0a0); }
.hp span { position: relative; display: block; text-align: center; font-size: 11px; line-height: 16px; direction: ltr; }
.st { margin: 3px 0; color: #dfe9f7; }
.info { margin: 4px 0; opacity: .75; font-size: 12px; line-height: 1.35; }
.row { display: flex; gap: 6px; margin-top: 8px; }
.btn { flex: 1; border: 1px solid rgba(160, 200, 255, 0.3); background: rgba(60, 110, 200, 0.35); border-radius: 12px; padding: 8px 6px; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.btn small { color: #ffd76a; font-size: 11px; direction: ltr; }
.btn:disabled { opacity: .45; }
.btn:active:not(:disabled) { transform: scale(.96); }
.btn.up { background: rgba(60, 170, 90, 0.4); border-color: rgba(120, 255, 160, .4); }
.btn.sell { background: rgba(160, 60, 60, 0.35); border-color: rgba(255, 140, 140, .35); }
.btn.go { background: linear-gradient(180deg, rgba(150, 90, 255, .65), rgba(90, 50, 200, .65)); border-color: rgba(200, 160, 255, .6); font-weight: bold; }
.btn.ship img { width: 44px; height: 30px; object-fit: contain; }
.queue { display: flex; gap: 4px; margin-top: 6px; }
.queue span { width: 30px; height: 26px; border-radius: 8px; background: rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; font-size: 15px; }
.queue span.now { background: linear-gradient(90deg, rgba(176, 124, 255, .7) var(--k), rgba(255, 255, 255, 0.1) var(--k)); }
.frow { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.frow img { width: 52px; height: 36px; object-fit: contain; }
.frow div { flex: 1; display: flex; flex-direction: column; }
.frow small { opacity: .75; font-size: 11px; }
.step { display: flex; align-items: center; gap: 6px; direction: ltr; }
.step button { width: 30px; height: 30px; border-radius: 9px; border: 0; background: rgba(255, 255, 255, 0.14); font-size: 18px; }
.step b { min-width: 20px; text-align: center; font-size: 16px; }

#place { position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border-radius: 14px; background: rgba(10, 16, 30, 0.88); border: 1px solid rgba(157, 255, 176, 0.4); max-width: 82vw; }
#place.show { display: flex; }
#place b { font-size: 14px; white-space: nowrap; }
#place span { font-size: 12px; opacity: .85; max-width: 330px; }
#place button { border: 0; border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: bold; }
#placeOk { background: #2fbf63; }
#placeOk:disabled { background: #555c66; opacity: .7; }
#placeNo { background: rgba(255, 255, 255, 0.15); }

#toast { position: fixed; top: 86px; left: 50%; transform: translateX(-50%) translateY(-8px); padding: 8px 16px; border-radius: 12px; background: rgba(10, 16, 30, 0.9); border: 1px solid rgba(160, 200, 255, 0.3); font-size: 14px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 30; white-space: nowrap; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------------------------------------------------------------- menus */
#screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 20; background: radial-gradient(ellipse at center, rgba(3, 5, 11, 0.15), rgba(3, 5, 11, 0.6)); }
#screen.show { display: flex; }
.menu { width: min(480px, 92vw); max-height: 94vh; overflow: auto; padding: 16px 20px; border-radius: 22px; background: rgba(8, 12, 26, 0.82); border: 1px solid rgba(160, 200, 255, 0.25); text-align: center; backdrop-filter: blur(8px); }
.menu h1 { margin: 2px 0; font-size: 40px; letter-spacing: 1px; background: linear-gradient(180deg, #ffffff, #8fd3ff); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(120, 190, 255, .35); }
.menu h1.win { background: linear-gradient(180deg, #fff6c8, #ffc44a); -webkit-background-clip: text; background-clip: text; }
.menu h1.lose { background: linear-gradient(180deg, #ffd6d0, #ff6a5a); -webkit-background-clip: text; background-clip: text; }
.menu h2 { margin: 4px 0 10px; }
.menu .sub { margin: 4px 0 12px; opacity: .85; }
.menu .btn { font-size: 15px; padding: 10px; }
.menu .btn.big { width: 100%; font-size: 19px; padding: 12px; margin-top: 4px; }
.menu .ver { display: block; margin-top: 10px; opacity: .5; }
.menu.text { text-align: right; }
.menu.text ul { padding-inline-start: 18px; line-height: 1.5; font-size: 14px; }
.menu .lic { font-size: 11px; opacity: .7; direction: ltr; text-align: left; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
.btn.lvl { font-size: 20px; padding: 12px 0; }
.btn.locked { opacity: .4; }

#rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #03050b; z-index: 100; font-size: 22px; }
@media (orientation: portrait) and (max-width: 700px) { #rotate { display: flex; } }
@media (max-height: 380px) { .card { width: 60px; height: 70px; } .card img { width: 50px; height: 40px; } .sheet { bottom: 84px; } #place { bottom: 84px; } }

</style>
</head>
<body>
<div id="boot">🪐 טוען את הכוכבים…</div>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="hud">
  <div id="top">
    <div class="pill hq"><span class="ic">🏛️</span><div class="bar"><i id="hqFill"></i></div><b id="hqTxt">100%</b></div>
    <div class="pill gold"><span class="ic">💎</span><b id="crys">0</b><small id="inc"></small></div>
    <div class="pill sh"><span id="shields"></span></div>
    <div class="pill en"><span class="ic">👾</span><div class="bar red"><i id="enFill"></i></div><b id="enTxt">100%</b></div>
  </div>
  <div id="views">
    <button data-view="home" title="הכוכב שלי">🏠<small>שלי</small></button>
    <button data-view="enemy" title="כוכב האויב">🎯<small>אויב</small></button>
    <button data-view="space" title="חלל">🌌<small>חלל</small></button>
  </div>
  <div id="corner"><button id="btnPause">⏸</button><button id="btnSpeed">⏩</button></div>
  <div id="alert"></div>
  <div id="build"><div id="cards"></div></div>
  <button id="fleetBtn"><span>🚀</span><b id="fleetN">0</b><small>צי</small></button>
  <div id="panel" class="sheet"></div>
  <div id="fleet" class="sheet"></div>
  <div id="place"><b id="placeName"></b><span id="placeWhy"></span><button id="placeOk">✓ בנה</button><button id="placeNo">✕</button></div>
  <canvas id="mini"></canvas>
</div>
<div id="screen"></div>
<div id="toast"></div>
<div id="rotate">📱↻ סובב את הטלפון לרוחב</div>
