# DuoPilot — בניית APK לאנדרואיד מתוך duopilot-src/ (Kotlin, בלי ספריות צד שלישי).
# רץ כשמשנים את duopilot-src/ (או ידנית). התוצר נדחף לענף duopilot-build:
#   DuoPilot-unsigned.apk (מיושר, לא חתום) + apksigner.jar + build.log + errors.txt + STATUS.txt
# אם קיים ה-Secret בשם DUOPILOT_KS_PASS – ה-APK נחתם כאן במפתח הקבוע ועולה לבד ל-duopilot/ באתר (ראה duopilot-src/CLAUDE.md).
# אם בהודעת ה-commit יש [emu] (או בהרצה ידנית) – רצה גם בדיקה על אמולטור, והתוצאות נדחפות לענף duopilot-emulator.
name: DuoPilot APK

on:
  push:
    branches: [main]
    paths: ['duopilot-src/**', '.github/workflows/duopilot-apk.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: duopilot-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        shell: bash
        working-directory: duopilot-src
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Keep debug APK for the emulator job
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: duopilot-debug
          path: duopilot-src/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

      # חתימה ופרסום אוטומטיים: רק אם קיים ה-Secret בשם DUOPILOT_KS_PASS (הסיסמה של keystore/duopilot.p12)
      # ורק כש-versionCode חדש יותר ממה שכבר באתר. הטלפונים מוצאים את הגרסה ב-duopilot/version.json ומתעדכנים לבד.
      - name: Sign and publish to the site
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          DUOPILOT_KS_PASS: ${{ secrets.DUOPILOT_KS_PASS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$DUOPILOT_KS_PASS" ]; then echo "No DUOPILOT_KS_PASS secret - unsigned APK goes to branch duopilot-build only"; exit 0; fi
          CODE=$(grep -E '^versionCode=' duopilot-src/version.properties | cut -d= -f2 | tr -d '[:space:]')
          PUB=$(python3 -c "import json;print(json.load(open('duopilot/version.json'))['versionCode'])" 2>/dev/null || echo 0)
          if [ "$CODE" -le "$PUB" ]; then echo "versionCode $CODE is already published ($PUB) - nothing to do"; exit 0; fi
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          REL="$RUNNER_TEMP/rel"; mkdir -p "$REL"
          "$BT/zipalign" -p -f 4 duopilot-src/app/build/outputs/apk/release/app-release-unsigned.apk "$REL/DuoPilot-unsigned.apk"
          cp "$BT/lib/apksigner.jar" "$REL/"
          "$BT/aapt" dump badging "$REL/DuoPilot-unsigned.apk" > "$REL/badging.txt"
          echo "outcome=success" > "$REL/STATUS.txt"
          DUOPILOT_KS=duopilot-src/keystore/duopilot.p12 bash duopilot-src/ci/sign-and-publish.sh "$REL"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add duopilot
          git commit -qm "Publish DuoPilot $(grep -E '^versionName=' duopilot-src/version.properties | cut -d= -f2) (signed in CI)"
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep $((attempt * 5))
          done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null 2>&1 || true

      - name: Publish result to branch duopilot-build
        if: always()
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          REL=duopilot-src/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -f "$REL" ]; then "$BT/zipalign" -p -f 4 "$REL" "$OUT/DuoPilot-unsigned.apk"; fi
          cp "$BT/lib/apksigner.jar" "$OUT/" 2>/dev/null || true
          if [ -f "$OUT/DuoPilot-unsigned.apk" ]; then "$BT/aapt" dump badging "$OUT/DuoPilot-unsigned.apk" > "$OUT/badging.txt" 2>&1 || true; fi
          tail -c 300000 "$RUNNER_TEMP/build.log" > "$OUT/build.log" 2>/dev/null || true
          grep -E "^e: |error:|FAILURE|What went wrong|AAPT|Execution failed" -A4 "$RUNNER_TEMP/build.log" | head -300 > "$OUT/errors.txt" || true
          echo "outcome=${{ steps.build.outcome }} run=${{ github.run_number }} sha=${{ github.sha }} build-tools=$(basename "$BT")" > "$OUT/STATUS.txt"
          cd "$OUT"
          git init -q -b duopilot-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "DuoPilot build ${{ github.run_number }}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:duopilot-build

  emulator:
    needs: apk
    if: contains(github.event.head_commit.message, '[emu]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: duopilot-debug
          path: debug-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run scenario on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK: debug-apk/app-debug.apk
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash duopilot-src/ci/emulator-test.sh

      - name: Publish results to branch duopilot-emulator
        if: always()
        shell: bash
        run: |
          test -d duopilot-emulator || exit 0
          cd duopilot-emulator
          git init -q -b duopilot-emulator
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "DuoPilot emulator run ${{ github.run_number }}"
          for attempt in 1 2 3; do
            git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:duopilot-emulator && exit 0
            sleep $((attempt * 10))
          done
          exit 1
