# MegaGlest Mobile — בניית APK לאנדרואיד (Capacitor) מתוך התיקייה megaglest-mobile.
# התוצר נדחף לענף megaglest-apk, ונחתם אחר כך במפתח הקבוע.
name: MegaGlest Mobile APK

on:
  push:
    branches: [main]
    paths: ['megaglest-mobile-app/**', '.github/workflows/megaglest-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: megaglest-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          bash megaglest-mobile-app/build-apk.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Publish result to branch megaglest-apk
        if: always()
        shell: bash
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"
          cp megaglest-mobile-app/out/* "$OUT/" 2>/dev/null || true
          tail -c 200000 "$RUNNER_TEMP/build.log" > "$OUT/build.log" 2>/dev/null || true
          echo "outcome=${{ steps.build.outcome }} run=${{ github.run_number }} sha=${{ github.sha }}" > "$OUT/STATUS.txt"
          cd "$OUT"
          git init -q -b megaglest-apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "APK build ${{ github.run_number }}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:megaglest-apk
